[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "purescale"
version = "4.0.0"
description = "Autonomous Multiscale Computational Vision and Edge AI Enhancement Engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
gui = [
    "customtkinter>=5.2.0",
    "onnxruntime-directml>=1.16.0; sys_platform == 'win32'",
    "onnxruntime>=1.16.0; sys_platform != 'win32'",
]

[project.scripts]
purescale = "purescale.cli:main"
purescale-gui = "purescale.gui.app:launch_gui"
