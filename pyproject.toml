[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "purescale"
version = "4.0.0"
description = "Autonomous Multiscale Computational Vision and Edge AI Enhancement Engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Barybht" }]
keywords = [
    "image-enhancement",
    "super-resolution",
    "computer-vision",
    "opencv",
    "onnx",
    "image-processing",
    "realesrgan",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
gui = [
    "customtkinter>=5.2.0",
    "onnxruntime-directml>=1.16.0; sys_platform == 'win32'",
    "onnxruntime>=1.16.0; sys_platform != 'win32'",
    "windnd>=1.0.2; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/Barybht/purescale-image-enhancer"
Repository = "https://github.com/Barybht/purescale-image-enhancer"
Issues = "https://github.com/Barybht/purescale-image-enhancer/issues"

[project.scripts]
purescale = "purescale.cli:main"
purescale-gui = "purescale.gui.app:launch_gui"

# Explicit package discovery. The repo root also hosts thin launcher modules
# (enhance_image.py, gui.py, engine_2026.py, portrait.py) and the bench/models
# directories; flat-layout auto-discovery sees all of them as top-level
# candidates and aborts, which broke `pip install -e .` / `pip wheel`.
[tool.setuptools.packages.find]
include = ["purescale*"]

# pytest runs the existing unittest classes directly (no rewrite needed;
# `python -m unittest discover` keeps working identically).
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# gui: needs a display (auto-skips headless); neural: downloads/touches model
# weights (registry entries are mocked, weights stay cached or absent);
# slow: runs the multi-second bench/perf-style paths.
markers = [
    "gui: creates Tk widgets (skipped when no display is available)",
    "neural: touches onnxruntime/model weight machinery",
    "slow: multi-second tests",
]

[tool.ruff]
line-length = 120
target-version = "py39"
# Start permissive (Phase 6 baseline): lint correctness classes only, no
# formatting churn, no style opinions. Tighten in later phases.
[tool.ruff.lint]
select = ["E9", "F", "W"]
ignore = []

[tool.mypy]
# Permissive start: the DSP pipeline is numpy-heavy and was written before
# any type checking; surface untyped-callables only, no strictness flags.
python_version = "3.9"
files = ["purescale"]
check_untyped_defs = false
ignore_missing_imports = true
exclude = ["build/", "tests/"]
