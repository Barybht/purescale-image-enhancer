name: PureScale CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.9", "3.10", "3.11", "3.12" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gui.txt
          pip install pytest

      - name: Verify zero non-ASCII emojis and code integrity
        run: |
          python -m unittest tests.test_purescale4.TestPureScale4CodeIntegrity -v

      - name: Run PureScale test suite
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Performance regression gate (quick fixtures, loose tolerance for shared runners)
        run: |
          python bench/bench.py --quick --check --tolerance 1.0
